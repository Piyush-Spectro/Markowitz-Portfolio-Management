[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markowitz-research"
version = "1.0.0"
description = "Reproducible portfolio research with forecasting, constrained optimization, and Bayesian views"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
neural = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
markowitz = "markowitz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
